name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests LINK-1/2/3 y custodia
        run: python -m unittest discover -s tests -v
      - name: Tests v0.5 (versión anterior)
        run: python -m unittest discover -s tests/v05 -v
      - name: Demo LINK (dos agentes por una sala simulada)
        run: python -m echo_wsp demo
      - name: Demo de humo (JSON + WAV + SVG)
        run: python -m echo_wsp v05 demo -o /tmp/wsp_demo
      - name: CLI de humo
        run: |
          python -m echo_wsp v05 atoms
          python -m echo_wsp v05 encode "te quiero" --compact
          python -m echo_wsp v05 encode "estoy aquí" | python -m echo_wsp v05 decode -
