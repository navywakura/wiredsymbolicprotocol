name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo de humo (JSON + WAV + SVG)
        run: python -m rogex_wsp demo -o /tmp/wsp_demo
      - name: CLI de humo
        run: |
          python -m rogex_wsp atoms
          python -m rogex_wsp encode "te quiero" --compact
          python -m rogex_wsp encode "estoy aquí" | python -m rogex_wsp decode -
